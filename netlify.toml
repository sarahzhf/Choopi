[build]
  publish = "public"
  command = ""

# Le service worker et la page doivent toujours être relus, pour que les mises à jour arrivent vite.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"
